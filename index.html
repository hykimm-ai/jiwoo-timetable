
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지우 시간표</title>

<style>
:root{
  --border:#e5e7eb;
  --bg:#ffffff;
  --page:#f3f4f6;
  --rowH:72px;
}
body{
  margin:0;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--page);
}
header{
  padding:18px;
  font-weight:900;
  font-size:26px;
  text-align:center;
  background:#fff;
  border-bottom:1px solid var(--border);
}
.gridWrap{
  overflow:auto;
  margin:16px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
}
.grid{
  min-width:900px;
  display:grid;
  grid-template-columns:110px repeat(5,1fr);
  grid-auto-rows:var(--rowH);
  position:relative;
}
.cell{
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}
.cell.head{background:#fafafa;font-size:20px;}
.cell.time{justify-content:flex-start;padding-left:12px;font-size:22px;}

.event{
  position:absolute;
  margin:8px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  color:#fff;
  padding:10px;
  font-size:18px;
}

/* 과목별 색상 */
.하교{background:#64748b;}
.영어{background:#3b82f6;}
.수학{background:#ef4444;}
.태권도{background:#111827;}
.축구{background:#16a34a;}
.바이올린{background:#a855f7;}
.한우리논술{background:#f97316;}
.미술{background:#ec4899;}
.수영{background:#0ea5e9;}
.집{background:#6b7280;}
</style>
</head>
<body>

<header id="title">지우 시간표</header>

<div class="gridWrap">
<div class="grid" id="grid"></div>
</div>

<script>
function toMinutes(t){
  const [h,m]=t.split(":").map(Number);
  return h*60+m;
}
function to12h(h){
  let hr=h%12;
  if(hr===0) hr=12;
  return hr+":00";
}

async function load(){
  const res = await fetch("schedule.json?ts="+Date.now());
  const data = await res.json();

  document.getElementById("title").textContent=data.title;

  const grid=document.getElementById("grid");
  grid.innerHTML="";

  const days=data.days;
  const start=data.startHour;
  const end=data.endHour;

  // header
  grid.appendChild(cell("시간","cell head time"));
  days.forEach(d=>grid.appendChild(cell(d,"cell head")));

  // rows
  for(let h=start;h<end;h++){
    grid.appendChild(cell(to12h(h),"cell time"));
    days.forEach(()=>grid.appendChild(cell("","cell")));
  }

  // event placement
  const allCells=grid.querySelectorAll(".cell");
  const colCount=1+days.length;
  const dayW=allCells[colCount+1].getBoundingClientRect().width;
  const timeW=allCells[colCount].getBoundingClientRect().width;
  const rowH=allCells[colCount+1].getBoundingClientRect().height;

  data.items.forEach(it=>{
    const dayIndex=days.indexOf(it.day);
    if(dayIndex===-1) return;

    const base=start*60;
    const s=toMinutes(it.start)-base;
    const e=toMinutes(it.end)-base;

    const top=rowH + (s/60)*rowH;
    const left=timeW + dayIndex*dayW;

    const ev=document.createElement("div");
    ev.className="event "+it.label;
    ev.textContent=it.label;
    ev.style.left=left+"px";
    ev.style.top=top+"px";
    ev.style.width=(dayW-16)+"px";
    ev.style.height=((e-s)/60*rowH-16)+"px";

    grid.appendChild(ev);
  });
}

function cell(text,cls){
  const d=document.createElement("div");
  d.className=cls;
  d.textContent=text;
  return d;
}

load();
</script>
</body>
</html>
