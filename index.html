
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지우 시간표</title>

<style>
:root{
  --rowH: 64px;
  --border:#e5e7eb;
}

/* 기본 */
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  background:#f8fafc;
  color:#111827;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 20px;
  font-weight:800;
  font-size:26px;
  background:white;
  border-bottom:1px solid var(--border);
}

.buttons button{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:white;
  font-weight:700;
  cursor:pointer;
}

.buttons button.primary{
  background:#0f172a;
  color:white;
}

/* 안내문 */
.notice{
  padding:16px 20px;
  font-size:14px;
  color:#475569;
  line-height:1.6;
}

/* 그리드 */
.wrapper{
  overflow:auto;
}

.grid{
  position:relative;
  display:grid;
  grid-template-columns:80px repeat(5,1fr);
  min-width:900px;
}

.cell{
  border:1px solid var(--border);
  height:var(--rowH);
  background:white;
}

.time{
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f1f5f9;
}

/* 이벤트 */
.event{
  position:absolute;
  left:0;
  right:0;
  margin:4px;
  padding:10px;
  border-radius:16px;
  font-weight:800;
  font-size:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
  color:#111827;
}

/* 단일시간(하교) */
.event.point{
  height:28px!important;
  padding:6px 10px!important;
  border-radius:999px!important;
  font-size:14px;
  box-shadow:none;
  border:1px dashed rgba(0,0,0,.15);
}

/* 파스텔 컬러 팔레트 */
.ev-하교{background:#e2e8f0;}
.ev-영어{background:#dbeafe;}
.ev-수학{background:#fee2e2;}
.ev-태권도{background:#dcfce7;}
.ev-축구{background:#fef3c7;}
.ev-바이올린{background:#f3e8ff;}
.ev-한우리논술{background:#ede9fe;}
.ev-미술{background:#fde68a;}
.ev-수영{background:#cffafe;}
.ev-집{background:#e5e7eb;}

/* 모바일 */
@media(max-width:600px){
  header{font-size:22px}
  .event{font-size:18px}
  .time{font-size:16px}
}
</style>
</head>

<body>

<header>
  지우 시간표
  <div class="buttons">
    <button onclick="location.reload()">새로고침</button>
    <button class="primary" onclick="enterEdit()">편집</button>
    <button onclick="window.print()">인쇄/PDF</button>
  </div>
</header>

<div class="notice">
• 조부모님: 링크만 클릭하면 바로 보기 (로그인 없음)<br>
• 부모: 편집 → PIN 입력(기본 1234)<br>
</div>

<div class="wrapper">
  <div class="grid" id="grid"></div>
</div>

<script>
const PIN="1234";

/* ===== 실제 시간표 데이터 ===== */
let schedule=[
  {day:"Mon",label:"하교",start:"13:30"},
  {day:"Mon",label:"영어",start:"13:40",end:"14:40"},
  {day:"Mon",label:"수학",start:"14:50",end:"16:30"},
  {day:"Mon",label:"태권도",start:"17:30",end:"18:20"},

  {day:"Tue",label:"하교",start:"14:20"},
  {day:"Tue",label:"축구",start:"14:30",end:"15:55"},
  {day:"Tue",label:"영어",start:"16:00",end:"17:00"},
  {day:"Tue",label:"태권도",start:"17:30",end:"18:20"},

  {day:"Wed",label:"하교",start:"13:30"},
  {day:"Wed",label:"바이올린",start:"13:40",end:"14:30"},
  {day:"Wed",label:"영어",start:"14:40",end:"15:40"},
  {day:"Wed",label:"태권도",start:"16:30",end:"17:20"},

  {day:"Thu",label:"하교",start:"13:30"},
  {day:"Thu",label:"영어",start:"13:40",end:"15:00"},
  {day:"Thu",label:"한우리논술",start:"15:10",end:"16:30"},
  {day:"Thu",label:"태권도",start:"17:30",end:"18:20"},

  {day:"Fri",label:"하교",start:"13:30"},
  {day:"Fri",label:"영어",start:"13:40",end:"14:45"},
  {day:"Fri",label:"미술",start:"15:00",end:"16:20"},
  {day:"Fri",label:"집",start:"16:30",end:"17:40"},
  {day:"Fri",label:"수영",start:"17:45",end:"19:00"},
];

/* ===== 유틸 ===== */
function toMinutes(t){
  const[h,m]=t.split(":").map(Number);
  return h*60+m;
}

function to12(t){
  let[h,m]=t.split(":").map(Number);
  h=h>12?h-12:h;
  return h+":"+m.toString().padStart(2,"0");
}

function minutesToY(m){
  const start=13*60;
  return (m-start)/60*parseInt(getComputedStyle(document.documentElement).getPropertyValue('--rowH'));
}

function isPoint(it){
  return !it.end;
}

/* ===== 렌더 ===== */
function render(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  const days=["Mon","Tue","Wed","Thu","Fri"];

  /* 시간 열 생성 */
  for(let h=13;h<=19;h++){
    const timeCell=document.createElement("div");
    timeCell.className="cell time";
    timeCell.innerText=to12(h+":00");
    grid.appendChild(timeCell);

    days.forEach(()=> {
      const c=document.createElement("div");
      c.className="cell";
      grid.appendChild(c);
    });
  }

  /* 이벤트 */
  schedule.forEach(it=>{
    const col=days.indexOf(it.day)+2;
    const ev=document.createElement("div");
    ev.className="event ev-"+it.label;

    const startM=toMinutes(it.start);
    const top=minutesToY(startM);

    ev.style.gridColumn=col;
    ev.style.top=top+"px";

    if(isPoint(it)){
      ev.classList.add("point");
      ev.innerHTML="🏫 하교 "+to12(it.start);
    }else{
      const endM=toMinutes(it.end);
      const height=minutesToY(endM)-minutesToY(startM);
      ev.style.height=height+"px";
      ev.innerHTML=to12(it.start)+"–"+to12(it.end)+"<br>"+it.label;
    }

    grid.appendChild(ev);
  });
}

render();

/* ===== PIN ===== */
function enterEdit(){
  const p=prompt("PIN 입력");
  if(p===PIN){
    alert("편집모드 (추가/수정 기능은 확장 가능)");
  }else{
    alert("PIN 오류");
  }
}
</script>

</body>
</html>
